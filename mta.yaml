_schema-version: '3.1'
ID: incident-management
version: 1.0.0
description: A simple CAP project.
parameters:
  deploy_mode: html5-repo
  enable-parallel-deployments: true
  subdomain: trailaws-ock2rw2v
build-parameters:
  before-all:
    - builder: custom
      commands:
        - rm -rf build/dist
        - mkdir -p build/dist
        - rm -rf build/ui-deployer
        - mkdir -p build/ui-deployer
    - builder: custom
      commands:
        - npm install --production
        - >-
          bash -c "cds -v | grep 'cds-dk' || npm i --production --no-save
          @sap/cds-dk"
        - bash -c "export PATH=$PATH:$(pwd)/node_modules/.bin"
        - cds build --production
  after-all:
    - builder: custom
      commands:
        - npm install
modules:
  - name: incident-management-ns.incidents
    type: html5
    path: app/incidents
    build-parameters:
      builder: custom
      commands:
        - rm -rf dist-zip dist
        - npm install
        - >-
          npx -p @ui5/cli@^3.0.0 ui5 build --dest dist
          --include-task=generateCachebusterInfo
        - mkdir dist-zip
        - bash -c "cd dist && npx bestzip ../dist-zip/nsincidents.zip *"
      _artifactName: nsincidents.zip
      supported-platforms: []
      build-result: dist-zip
  - name: incident-management-db-deployer
    type: hdb
    path: gen/db
    parameters:
      buildpack: nodejs_buildpack
    build-parameters:
      builder: npm
      ignore:
        - node_modules
        - package-lock.json
    requires:
      - name: incident-management-service-uaa
      - name: incident-management-service-db
  - name: incident-management-srv
    type: nodejs
    path: gen/srv
    parameters:
      memory: 256MB
    provides:
      - name: srv-api
        properties:
          srv-url: ${default-url}
    build-parameters:
      builder: npm
      ignore:
        - node_modules
        - package-lock.json
    requires:
      - name: incident-management-service-uaa
      - name: incident-management-service-db
      - name: incident-management-service-destination
      - name: incident-management-service-metadata
      - name: incident-management-service-connectivity
      - name: incident-management-service-logs
  - name: incident-management-aux-destinations
    type: com.sap.application.content
    parameters:
      content:
        subaccount:
          existing_destinations_policy: update
          destinations:
            - Authentication: OAuth2UserTokenExchange
              Name: incident-management-service-uaa
              ServiceInstanceName: incident-management-uaa
              ServiceKeyName: incident-management-uaa-key
              sap.cloud.service: lcap.incident-management
            - Authentication: OAuth2UserTokenExchange
              Name: incident-management-app-srv
              TokenServiceInstanceName: incident-management-uaa
              TokenServiceKeyName: incident-management-uaa-key
              URL: ~{srv-api/srv-url}
              sap.cloud.service: lcap.incident-management
            - Name: incident-management-service-html5-apps-repo-host
              ServiceInstanceName: incident-management-html5-apps-repo-host
              ServiceKeyName: incident-management-html5-apps-repo-host-key
              sap.cloud.service: lcap.incident-management
            - Authentication: OAuth2UserTokenExchange
              Name: incident-management-ProcessorService
              TokenServiceInstanceName: incident-management-uaa
              TokenServiceKeyName: incident-management-uaa-key
              URL: ~{srv-api/srv-url}/odata/v4/processor
              sap.cloud.service: lcap.incident-management
              sap.applicationdevelopment.actions.enabled: false
              sap.build.usage: CAP
              sap.processautomation.enabled: false
              HTML5.DynamicDestination: false
              WebIDEEnabled: false
              MobileEnabled: false
              AppgyverEnabled: false
            - Authentication: OAuth2UserTokenExchange
              Name: incident-management-AdminService
              TokenServiceInstanceName: incident-management-uaa
              TokenServiceKeyName: incident-management-uaa-key
              URL: ~{srv-api/srv-url}/odata/v4/admin
              sap.cloud.service: lcap.incident-management
              sap.applicationdevelopment.actions.enabled: false
              sap.build.usage: CAP
              sap.processautomation.enabled: false
              HTML5.DynamicDestination: false
              WebIDEEnabled: false
              MobileEnabled: false
              AppgyverEnabled: false
    build-parameters:
      no-source: true
    requires:
      - name: incident-management-service-uaa
        parameters:
          service-key:
            name: incident-management-uaa-key
      - name: srv-api
      - name: incident-management-service-html5-apps-repo-host
        parameters:
          service-key:
            name: incident-management-html5-apps-repo-host-key
      - name: incident-management-service-destination
        parameters:
          content-target: true
  - name: incident-management-launchpad
    type: html5
    path: build/launchpad
    build-parameters:
      builder: custom
      commands:
        - npm install
        - >-
          npx -p @ui5/cli@^3.0.0 ui5 build --dest dist
          --include-task=generateCachebusterInfo
        - bash -c "cd dist && npx bestzip ../../../build/dist/launchpad.zip *"
        - rm -rf dist
      _artifactName: launchpad.zip
      supported-platforms: []
      build-result: ../../build/dist
  - name: incident-management-aux-ui-deployer
    type: com.sap.application.content
    path: build/ui-deployer
    build-parameters:
      build-result: resources
      requires:
        - name: incident-management-ns.incidents
          artifacts:
            - nsincidents.zip
          target-path: resources
        - name: incident-management-launchpad
          artifacts:
            - launchpad.zip
          target-path: resources
    requires:
      - name: incident-management-service-html5-apps-repo-host
        parameters:
          content-target: true
resources:
  - type: org.cloudfoundry.managed-service
    name: incident-management-service-uaa
    parameters:
      service: xsuaa
      service-plan: application
      service-name: incident-management-uaa
      path: xs-security.json
      config:
        oauth2-configuration:
          redirect-uris:
            - https://${subdomain}.launchpad.${default-domain}/login/*
            - https://${subdomain}.${default-domain}/login/*
          credential-types:
            - binding-secret
            - x509
        xsappname: incident-management-${space}
        role-collections:
          - description: support
            name: incident-management-support-${space}
            role-template-references:
              - $XSAPPNAME.support
          - description: admin
            name: incident-management-admin-${space}
            role-template-references:
              - $XSAPPNAME.admin
  - type: org.cloudfoundry.managed-service
    name: incident-management-service-db
    parameters:
      service: hana
      service-plan: hdi-shared
      service-name: incident-management-db
  - type: org.cloudfoundry.managed-service
    name: incident-management-service-destination
    parameters:
      service: destination
      service-plan: lite
      service-name: incident-management-destination
      config:
        HTML5Runtime_enabled: true
        version: 1.0.0
  - type: org.cloudfoundry.user-provided-service
    name: incident-management-service-metadata
    parameters:
      service: metadata
      service-plan: standard
      service-name: incident-management-metadata
      config:
        default-domain: ${default-domain}
  - type: org.cloudfoundry.managed-service
    name: incident-management-service-connectivity
    parameters:
      service: connectivity
      service-plan: lite
      service-name: incident-management-connectivity
  - type: org.cloudfoundry.managed-service
    name: incident-management-service-logs
    parameters:
      service: application-logs
      service-plan: lite
      service-name: incident-management-logs
  - type: org.cloudfoundry.managed-service
    name: incident-management-service-html5-apps-repo-host
    parameters:
      service: html5-apps-repo
      service-plan: app-host
      service-name: incident-management-html5-apps-repo-host
